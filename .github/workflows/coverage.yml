name: Coverage Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    name: Coverage Gate (85% Line, 90% Branch)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with branch coverage and generate reports
        run: |
          cargo llvm-cov --branch --html --output-dir target/llvm-cov/html
          cargo llvm-cov report --branch --json --summary-only --output-path coverage.json

      - name: Enforce coding standards (no-private-helpers, type-per-file, zero-alloc)
        run: |
          python3 .github/scripts/check_coding_standards.py

      - name: Enforce coverage gate (85% Line, 90% Branch)
        run: |
          python3 .github/scripts/check_coverage.py coverage.json --min-line 85.0 --min-branch 90.0 --markdown-output coverage_summary.md

      - name: Post or update PR coverage comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'coverage_summary.md';
            if (!fs.existsSync(summaryPath)) {
              console.log('No coverage summary file found; skipping PR comment.');
              return;
            }
            const body = fs.readFileSync(summaryPath, 'utf8');
            const commentHeader = '<!-- flotilla-coverage-gate-report -->';
            const fullBody = `${commentHeader}\n${body}`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(c => c.body && c.body.includes(commentHeader));
              if (existingComment) {
                console.log(`Updating existing PR comment ID ${existingComment.id}`);
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: fullBody,
                });
              } else {
                console.log('Creating new PR comment');
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fullBody,
                });
              }
            } catch (error) {
              console.error('Failed to post or update PR comment:', error.message);
            }

      - name: Upload HTML coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: target/llvm-cov/html
          retention-days: 14
