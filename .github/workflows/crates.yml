name: Crate Builds & Module Matrix

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*', 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without publishing to crates.io)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-modules:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Sans-I/O Core Engine (No Default Features)
            flags: --no-default-features
          - name: Default Client UDP Transport
            flags: ""
          - name: TCP Transports (Client & Server)
            flags: --no-default-features --features tcp
          - name: gRPC Transports (Client & Server)
            flags: --no-default-features --features grpc
          - name: Cosmos DB Archival Offloader
            flags: --no-default-features --features cosmos
          - name: Full Suite (All Transports & Offloaders)
            flags: --all-features

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc (Protobuf Compiler)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Check compilation
        run: cargo check ${{ matrix.flags }}

      - name: Run test suite
        run: cargo test ${{ matrix.flags }} --all-targets

  package-and-lint:
    name: Crate Packaging & Lint Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain with clippy & rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protoc (Protobuf Compiler)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting (rustfmt)
        run: cargo fmt -- --check

      - name: Check clippy lints (-D warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Verify package dry-run (cargo package)
        run: cargo package --no-verify

      - name: Verify documentation generation
        run: cargo doc --all-features --no-deps

      - name: Upload packaged crate artifact
        uses: actions/upload-artifact@v4
        with:
          name: flotilla-crate-package
          path: target/package/*.crate
          if-no-files-found: error
          retention-days: 14

  publish-crate:
    name: Publish to crates.io
    needs: [build-modules, package-and-lint]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc (Protobuf Compiler)
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust caching
        uses: Swatinem/rust-cache@v2

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CRATES_IO_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::Neither CARGO_REGISTRY_TOKEN nor CRATES_IO_TOKEN secret is configured in repository secrets. Skipping publish to crates.io."
            echo "To enable publishing, set CARGO_REGISTRY_TOKEN in Settings -> Secrets and variables -> Actions."
            exit 0
          fi

          CRATE_NAME=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          CRATE_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "Inspecting crates.io status for ${CRATE_NAME} v${CRATE_VERSION}..."

          PUBLISHED_INFO=$(curl -s -H "User-Agent: flotilla-ci-publisher" "https://crates.io/api/v1/crates/${CRATE_NAME}/${CRATE_VERSION}")
          PUBLISHED_NUM=$(echo "${PUBLISHED_INFO}" | jq -r '.version.num // empty')

          if [ "${PUBLISHED_NUM}" = "${CRATE_VERSION}" ]; then
            echo "Notice: ${CRATE_NAME} version ${CRATE_VERSION} is already published on crates.io. Skipping publish."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run requested: running 'cargo publish --dry-run'"
            cargo publish --dry-run
          else
            echo "Publishing ${CRATE_NAME} v${CRATE_VERSION} to crates.io..."
            cargo publish
          fi
