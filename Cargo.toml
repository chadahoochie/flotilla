[package]
name = "flotilla"
version = "0.1.0"
edition = "2024"
authors = ["Flotilla Contributors"]
description = "High-Throughput, Low-Latency Sans-I/O Raft in Safe Rust (Rust 1.98+ / Edition 2024)"
license = "MIT OR Apache-2.0"

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
crc32fast = "1.4"
parking_lot = "0.12"

# Optional dependencies for Cosmos DB archival offloader
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
urlencoding = { version = "2.1", optional = true }

[features]
default = []
cosmos = [
    "dep:reqwest",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:hmac",
    "dep:sha2",
    "dep:base64",
    "dep:chrono",
    "dep:urlencoding",
]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bench]]
name = "raft_benchmarks"
harness = false
