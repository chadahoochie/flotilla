[package]
name = "flotilla-raft"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
authors = ["Flotilla Contributors"]
description = "High-Throughput, Low-Latency Sans-I/O Raft in Safe Rust (Rust 1.99+ / Edition 2024)"
license = "MIT"
repository = "https://github.com/chadahoochie/flotilla"
documentation = "https://docs.rs/flotilla-raft"
readme = "README.md"

[dependencies]
zerocopy = { version = "0.8", features = ["derive"] }
crc32fast = "1.4"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }

# Optional dependencies for Cosmos DB archival offloader
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
urlencoding = { version = "2.1", optional = true }

# Optional dependencies for gRPC
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }

# Optional dependencies for OpenTelemetry
opentelemetry = { version = "0.27", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["trace", "metrics", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["grpc-tonic", "trace", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.28", default-features = false, features = ["metrics"], optional = true }

[build-dependencies]
tonic-build = { version = "0.12", optional = true }
protoc-bin-vendored = { version = "3.2.0", optional = true }

[features]
default = ["client-udp"]
client-udp = []
client-tcp = ["dep:tokio"]
client-grpc = ["dep:tokio", "dep:tonic", "dep:prost", "dep:tonic-build", "dep:protoc-bin-vendored"]
server-tcp = ["dep:tokio"]
server-grpc = ["dep:tokio", "dep:tonic", "dep:prost", "dep:tonic-build", "dep:protoc-bin-vendored"]

# Composite feature flags
udp = ["client-udp"]
tcp = ["client-tcp", "server-tcp"]
grpc = ["client-grpc", "server-grpc"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tokio",
    "dep:tonic",
]
full = ["udp", "tcp", "grpc", "cosmos", "otel"]

cosmos = [
    "dep:reqwest",
    "dep:tokio",
    "dep:serde",
    "dep:serde_json",
    "dep:hmac",
    "dep:sha2",
    "dep:base64",
    "dep:chrono",
    "dep:urlencoding",
]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[[bench]]
name = "raft_benchmarks"
harness = false

[[bin]]
name = "flotilla-server"
path = "src/bin/flotilla-server.rs"
required-features = ["full"]
