syntax = "proto3";

package flotilla;

service FlotillaService {
  rpc Propose (ProposalRequest) returns (ProposalResponse);
  rpc Step (StepRequest) returns (StepResponse);
  rpc ClusterStatus (StatusRequest) returns (StatusResponse);
}

message ProposalRequest {
  bytes payload = 1;
}

message ProposalResponse {
  bool success = 1;
  uint64 index = 2;
  uint64 term = 3;
  uint64 leader_id = 4;
  string error_message = 5;
}

message StepRequest {
  uint64 sender_id = 1;
  bytes packet = 2;
}

message StepResponse {
  repeated OutboundPacket packets = 1;
}

message OutboundPacket {
  uint64 to_node_id = 1;
  bytes packet = 2;
}

message StatusRequest {}

message StatusResponse {
  uint64 node_id = 1;
  string role = 2;
  uint64 term = 3;
  uint64 commit_index = 4;
  uint64 leader_id = 5;
}
